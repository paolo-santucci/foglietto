name: Android Release

# Purpose
# -------
# Build the Android app for Play and put it on the Play Console.
#
#   build_android  → signs and bundles the release AAB (+ a release APK for
#                    sideload testing) and keeps both as workflow artifacts.
#                    Runs on every push/PR so release-only breakage (resource
#                    merging, R8/lint tasks, signing wiring) is caught before a
#                    tag. Without the signing secrets (pull requests from forks,
#                    local runs) it still builds — the AAB is unsigned and the
#                    log says so.
#   deploy_play    → uploads that exact AAB to the Play Console track chosen by
#                    the operator. Tag-gated (`v*`) or manually dispatched; never
#                    runs on a pull request.
#
# Why this file is NOT called android.yml
# ---------------------------------------
# tool/m1_gate.sh check (f) and tool/m8_gate.sh check 4 ban
# `.github/workflows/android.yml` outright: Android *verification* (./gradlew
# check + the m1–m8 structural gates) lives in quality.yml, and a second
# verification workflow would fork the green path. This workflow is the release
# path — it builds and publishes, it does not decide whether the tree is valid.

on:
  push:
    branches: [main, kmp-rewrite]
    tags: ['v*']
  pull_request:
    branches: [main, kmp-rewrite]
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "versionName override (e.g. 1.0.1). Blank = repo var ANDROID_MARKETING_VERSION, then 1.0.0."
        required: false
        type: string
        default: ""
      build_number_offset:
        description: "Integer added to GITHUB_RUN_NUMBER for versionCode. Blank = repo var ANDROID_BUILD_NUMBER_OFFSET, then 0."
        required: false
        type: string
        default: ""
      track:
        description: "Play track to publish to."
        required: false
        type: choice
        default: internal
        options:
          - internal
          - alpha
          - beta
          - production
      release_status:
        description: "Play release status. 'completed' ships to testers immediately; 'draft' only stages the build."
        required: false
        type: choice
        default: completed
        options:
          - completed
          - draft
      upload_to_play:
        description: "Upload to the Play Console after building (this dispatch only; tags always upload)."
        required: false
        type: boolean
        default: true

jobs:
  # ---------------------------------------------------------------------------
  # build_android — one signed AAB, one signed release APK, both as artifacts.
  # The AAB is the only file deploy_play ever reads, so the bytes that reach
  # Play are exactly the bytes this job validated.
  # ---------------------------------------------------------------------------
  build_android:
    runs-on: ubuntu-latest

    # A run that reaches Play must be able to sign. Tag pushes and dispatches
    # that will upload treat missing key material as a hard failure; ordinary
    # push/PR runs degrade to an unsigned build with a warning instead of
    # turning red on a fork where secrets are unavailable.
    env:
      REQUIRES_SIGNING: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.upload_to_play) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same toolchain as quality.yml: Temurin 17 (the JDK the Gradle build and
      # the Robolectric matrix are pinned to) with the built-in Gradle cache.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # Third-party action pinned to a full commit SHA (tag v3 resolved once), as
      # in quality.yml — a mutable tag could silently change the SDK tooling.
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: "15859902"
          accept-android-sdk-licenses: true
          packages: platform-tools

      # compileSdk/targetSdk 36 + the matching build-tools, resolved through the
      # environment so every later step sees the same SDK root.
      - name: Install Android SDK components
        run: |
          : "${ANDROID_HOME:?setup-android did not export ANDROID_HOME}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      # versionCode must increase with every Play upload and is capped at
      # 2100000000. Deriving it from the run number keeps the tree free of
      # per-release edits; the offset lets an operator jump past codes already
      # consumed in the Console (or past a workflow re-creation that reset the
      # run counter) without touching a file.
      - name: Resolve version identity
        id: version
        env:
          # Inputs are injected through the environment, never interpolated into
          # the shell program text (a value containing a quote must not become code).
          INPUT_MARKETING_VERSION: ${{ inputs.marketing_version }}
          INPUT_BUILD_NUMBER_OFFSET: ${{ inputs.build_number_offset }}
          VAR_MARKETING_VERSION: ${{ vars.ANDROID_MARKETING_VERSION }}
          VAR_BUILD_NUMBER_OFFSET: ${{ vars.ANDROID_BUILD_NUMBER_OFFSET }}
        run: |
          set -euo pipefail

          NAME="${INPUT_MARKETING_VERSION:-}"
          [ -z "$NAME" ] && NAME="${VAR_MARKETING_VERSION:-}"
          [ -z "$NAME" ] && NAME="1.0.0"

          OFFSET="${INPUT_BUILD_NUMBER_OFFSET:-}"
          [ -z "$OFFSET" ] && OFFSET="${VAR_BUILD_NUMBER_OFFSET:-}"
          [ -z "$OFFSET" ] && OFFSET="0"

          if ! [[ "$NAME" =~ ^[0-9]+(\.[0-9]+){0,3}([-.+][0-9A-Za-z.+-]+)?$ ]]; then
            echo "ERROR: versionName '$NAME' is not a usable version string." >&2
            exit 1
          fi
          if ! [[ "$OFFSET" =~ ^[0-9]+$ ]]; then
            echo "ERROR: build number offset '$OFFSET' must be a non-negative integer." >&2
            exit 1
          fi

          CODE=$(( GITHUB_RUN_NUMBER + OFFSET ))
          if [ "$CODE" -lt 1 ] || [ "$CODE" -gt 2100000000 ]; then
            echo "ERROR: versionCode $CODE is outside Play's 1..2100000000 range." >&2
            exit 1
          fi

          echo "versionName: $NAME"
          echo "versionCode: $CODE"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      # The upload key is decoded from GitHub secrets onto the ephemeral runner
      # and removed again at the end of the job. Nothing here is committed and
      # nothing is echoed: GitHub masks secret values in the log.
      - name: Decode release signing material
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          missing=""
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$ANDROID_KEYSTORE_PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$ANDROID_KEY_ALIAS" ] || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$ANDROID_KEY_PASSWORD" ] || missing="$missing ANDROID_KEY_PASSWORD"

          if [ -n "$missing" ]; then
            if [ "$REQUIRES_SIGNING" = "true" ]; then
              echo "ERROR: release signing secrets are not configured (missing:$missing)." >&2
              echo "An unsigned AAB cannot be uploaded to Play — add the secrets, or build without an upload." >&2
              exit 1
            fi
            echo "::warning::Release signing secrets not configured (missing:$missing) — the release AAB will be UNSIGNED."
            echo "keystore_path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SIGNING_DIR="$RUNNER_TEMP/android-signing"
          mkdir -p "$SIGNING_DIR"
          KEYSTORE="$SIGNING_DIR/upload.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"

          echo "keystore_path=$KEYSTORE" >> "$GITHUB_OUTPUT"

      # bundleRelease  → the Play artifact (signed when the env is complete)
      # assembleRelease → the same code in APK form, for sideloading onto a device
      #                   that is not on the tester list
      - name: Build release bundle and APK
        env:
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.code }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.name }}
          ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew :androidApp:bundleRelease :androidApp:assembleRelease --no-daemon

      # An unsigned bundle is valid APK-shaped output but useless for Play.
      # `jarsigner -verify` is NOT enough on its own: it prints "jar is unsigned."
      # and still exits 0, so the verdict must be read from its output. Fail
      # closed whenever this run is expected to reach Play.
      - name: Verify the bundle is signed
        run: |
          set -euo pipefail

          AAB=$(find androidApp/build/outputs/bundle/release -name '*.aab' -type f 2>/dev/null | head -1 || true)
          if [ -z "$AAB" ]; then
            echo "ERROR: bundleRelease produced no .aab — check the Gradle log above." >&2
            exit 1
          fi
          echo "Bundle: $AAB"

          VERIFY=$(jarsigner -verify "$AAB" 2>&1 || true)
          if grep -q 'jar verified' <<< "$VERIFY"; then
            echo "$VERIFY" | head -5
            echo "The AAB carries a valid signature."
          else
            echo "$VERIFY" | head -5
            if [ "$REQUIRES_SIGNING" = "true" ]; then
              echo "ERROR: the AAB is not signed and this run must reach Play." >&2
              exit 1
            fi
            echo "::warning::The release AAB is UNSIGNED (signing secrets absent) — artifact only, not uploadable."
          fi

      # Collect the two artifacts under an unambiguous name that carries the
      # exact version identity Play will see.
      - name: Stage artifacts
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/android-artifacts"
          mkdir -p "$STAGE"
          BASE="foglietto-${VERSION_NAME}-${VERSION_CODE}"

          AAB=$(find androidApp/build/outputs/bundle/release -name '*.aab' -type f | head -1)
          APK=$(find androidApp/build/outputs/apk/release -name '*.apk' -type f | head -1)
          cp "$AAB" "$STAGE/$BASE.aab"
          cp "$APK" "$STAGE/$BASE.apk"
          ls -lh "$STAGE"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: foglietto-android
          path: ${{ runner.temp }}/android-artifacts/*
          if-no-files-found: error

      # Always: the decoded key must not survive the job on the runner.
      - name: Cleanup signing material
        if: always()
        env:
          KEYSTORE: ${{ steps.signing.outputs.keystore_path }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            rm -f "$KEYSTORE"
            rmdir "$(dirname "$KEYSTORE")" 2>/dev/null || true
          fi

  # ---------------------------------------------------------------------------
  # deploy_play — the Play Console upload.
  #
  # Runs on a `v*` tag or on a manual dispatch that asked for it. It downloads
  # the AAB built by build_android (never rebuilds), re-verifies the signature,
  # then hands the file to the Google Play Developer API through a service
  # account. First-run note: Play refuses a raw production upload with no prior
  # track history — publish internal first, then promote.
  # ---------------------------------------------------------------------------
  deploy_play:
    needs: build_android
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.upload_to_play)
    # Serialise uploads: two edits against the same Play app race and one loses
    # with "concurrent edits". Never cancel a run mid-upload.
    concurrency:
      group: play-upload
      cancel-in-progress: false
    # Optional protection scope: attach required reviewers / environment-scoped
    # secrets to `google-play` in the repository settings.
    environment: google-play

    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: foglietto-android
          path: ${{ runner.temp }}/artifacts

      # jarsigner ships with the JDK; this job runs no Gradle build.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Verify the downloaded bundle is signed
        run: |
          set -euo pipefail
          AAB=$(find "$RUNNER_TEMP/artifacts" -name '*.aab' -type f 2>/dev/null | head -1 || true)
          if [ -z "$AAB" ]; then
            echo "ERROR: no .aab in the downloaded artifact." >&2
            exit 1
          fi
          # `jarsigner -verify` exits 0 even for an unsigned jar ("jar is
          # unsigned."), so the verdict has to be read from its output.
          VERIFY=$(jarsigner -verify "$AAB" 2>&1 || true)
          if ! grep -q 'jar verified' <<< "$VERIFY"; then
            echo "$VERIFY" | head -5
            echo "ERROR: $AAB is not signed — Play rejects unsigned bundles." >&2
            exit 1
          fi
          echo "Bundle verified: $AAB"

      # Track/status resolution lives in bash (same idiom as ios.yml) so a tag
      # push and a dispatch share one code path: dispatch input, else default.
      - name: Resolve Play target
        id: play
        env:
          INPUT_TRACK: ${{ inputs.track }}
          INPUT_RELEASE_STATUS: ${{ inputs.release_status }}
        run: |
          set -euo pipefail

          TRACK="${INPUT_TRACK:-}"
          [ -z "$TRACK" ] && TRACK="internal"
          STATUS="${INPUT_RELEASE_STATUS:-}"
          [ -z "$STATUS" ] && STATUS="completed"

          case "$TRACK" in
            internal|alpha|beta|production) ;;
            *) echo "ERROR: unknown Play track '$TRACK'." >&2; exit 1 ;;
          esac
          case "$STATUS" in
            completed|draft|inProgress|halted) ;;
            *) echo "ERROR: unknown Play release status '$STATUS'." >&2; exit 1 ;;
          esac

          echo "track=$TRACK" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      # The service-account JSON arrives base64-encoded (line breaks in raw JSON
      # secrets are a classic silent-corruption source) and is written to a
      # 0600 file that is deleted at the end of the job.
      - name: Decode Play service account
        id: credentials
        env:
          PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON_BASE64" ]; then
            echo "ERROR: secret PLAY_SERVICE_ACCOUNT_JSON_BASE64 is not set." >&2
            echo "Create a Play Developer API service account, invite it in Play Console" >&2
            echo "(Users and permissions → app permissions), and store its JSON key base64-encoded." >&2
            exit 1
          fi

          CRED_DIR="$RUNNER_TEMP/play-credentials"
          mkdir -p "$CRED_DIR"
          CREDENTIALS="$CRED_DIR/service-account.json"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON_BASE64" | base64 --decode > "$CREDENTIALS"
          chmod 600 "$CREDENTIALS"
          echo "path=$CREDENTIALS" >> "$GITHUB_OUTPUT"

      # Third-party action pinned to a full commit SHA (tag v1.1.5 resolved once).
      # Google Play Developer API v3: uploads the AAB, assigns it to the track and
      # commits the edit — i.e. the build appears under Internal testing / the
      # chosen track in the Play Console.
      - name: Upload to Play Console
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJson: ${{ steps.credentials.outputs.path }}
          packageName: com.paolosantucci.foglietto
          releaseFiles: ${{ runner.temp }}/artifacts/**/*.aab
          tracks: ${{ steps.play.outputs.track }}
          status: ${{ steps.play.outputs.status }}
          # Let Play review the change normally. Switch to true to stage a
          # production rollout that an operator releases by hand.
          changesNotSentForReview: false

      - name: Cleanup Play credentials
        if: always()
        env:
          CREDENTIALS: ${{ steps.credentials.outputs.path }}
        run: |
          if [ -n "$CREDENTIALS" ]; then
            rm -f "$CREDENTIALS"
            rmdir "$(dirname "$CREDENTIALS")" 2>/dev/null || true
          fi
